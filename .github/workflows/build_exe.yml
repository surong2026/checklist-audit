name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit openpyxl python-docx pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller build.spec --noconfirm --clean

      - name: Create ZIP archive
        shell: powershell
        run: |
          Compress-Archive -Path dist/ChecklistAudit/* -DestinationPath ChecklistAudit_Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChecklistAudit_Windows
          path: ChecklistAudit_Windows.zip
          retention-days: 30
